name: Refresh npm plugins in the market

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-npm-market
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The generator reads the pinned commits of the self-authored plugins.
          fetch-depth: 0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
      - name: Resolve npm tags and validate the generated index
        run: |
          node scripts/plugins.mjs index --refresh
          node scripts/plugins.mjs check
          node --test scripts/plugins.test.mjs
      - name: Open or update the version refresh PR
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          branch: automation/refresh-market-npm
          delete-branch: true
          add-paths: |
            plugins.json
            market/index.json
            README.md
          commit-message: 'chore(market): refresh npm plugin versions'
          title: 'chore(market): refresh npm plugin versions'
          body: |
            Resolve the configured npm dist-tags and regenerate the market index and README.
            Self-authored plugin pins are unchanged. Review the upstream releases before merging.
